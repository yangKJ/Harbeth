name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftpm:
    name: Swift 6 Build, Tests and Public API Smoke
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: xcrun swift build
      - name: Test
        shell: bash
        run: |
          if xcrun swift -e 'import Metal; import Darwin; exit(MTLCreateSystemDefaultDevice() == nil ? 1 : 0)'; then
            xcrun swift test
          else
            echo '::warning::No Metal device is available on this runner; compiling and enumerating the complete test inventory instead.'
            xcrun swift test list > /dev/null
          fi

  framework-builds:
    name: ${{ matrix.name }} Framework Build
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS Simulator
          - name: macOS
            destination: generic/platform=macOS
          - name: tvOS
            destination: generic/platform=tvOS Simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Harbeth
        run: >-
          xcodebuild build
          -workspace Harbeth.xcworkspace
          -scheme Harbeth
          -configuration Debug
          -destination '${{ matrix.destination }}'
          CODE_SIGNING_ALLOWED=NO

  demos:
    name: ${{ matrix.name }} Demo Build
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: UIKit
            scheme: Harbeth-iOS-Demo
            destination: generic/platform=iOS Simulator
          - name: SwiftUI
            scheme: Harbeth-SwiftUI-Demo
            destination: generic/platform=iOS Simulator
          - name: AppKit
            scheme: Harbeth-macOS-Demo
            destination: generic/platform=macOS
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build demo
        run: >-
          xcodebuild build
          -workspace Harbeth.xcworkspace
          -scheme '${{ matrix.scheme }}'
          -configuration Debug
          -destination '${{ matrix.destination }}'
          CODE_SIGNING_ALLOWED=NO

  documentation:
    name: DocC Build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build documentation
        run: >-
          xcodebuild docbuild
          -workspace Harbeth.xcworkspace
          -scheme Harbeth
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO

  cocoapods:
    name: CocoaPods Lint
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint podspec
        run: pod lib lint Harbeth.podspec --platforms=ios,macos,tvos --skip-tests

name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftpm:
    name: Swift 6 Debug and Release Tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: xcrun swift build
      - name: Test
        shell: bash
        run: |
          if xcrun swift -e 'import Metal; import Darwin; exit(MTLCreateSystemDefaultDevice() == nil ? 1 : 0)'; then
            xcrun swift test
          else
            echo '::warning::No Metal device is available on this runner; compiling and enumerating the complete test inventory instead.'
            xcrun swift test list > /dev/null
          fi
      - name: Release build and tests
        shell: bash
        run: |
          xcrun swift build -c release
          if xcrun swift -e 'import Metal; import Darwin; exit(MTLCreateSystemDefaultDevice() == nil ? 1 : 0)'; then
            xcrun swift test -c release
          else
            xcrun swift test -c release list > /dev/null
          fi
      - name: Latest commit whitespace gate
        run: git show --check --format= HEAD

  public-api:
    name: Public API Compatibility
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile external public API smoke tests
        run: xcrun swift test list > /dev/null
      - name: Compare against 3.0 baseline when available
        shell: bash
        run: |
          if git rev-parse --verify refs/tags/3.0.0 > /dev/null 2>&1; then
            xcrun swift package diagnose-api-breaking-changes 3.0.0 --products Harbeth
          else
            echo '3.0.0 tag is not published yet; smoke compilation is the pre-release API gate.'
          fi

  framework-builds:
    name: ${{ matrix.name }} Framework Build
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS Simulator
          - name: macOS
            destination: generic/platform=macOS
          - name: tvOS
            destination: generic/platform=tvOS Simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Harbeth
        run: >-
          xcodebuild build
          -workspace Harbeth.xcworkspace
          -scheme Harbeth
          -configuration Release
          -destination '${{ matrix.destination }}'
          CODE_SIGNING_ALLOWED=NO

  demos:
    name: ${{ matrix.name }} Demo Build
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: UIKit
            scheme: Harbeth-iOS-Demo
            destination: generic/platform=iOS Simulator
          - name: SwiftUI
            scheme: Harbeth-SwiftUI-Demo
            destination: generic/platform=iOS Simulator
          - name: AppKit
            scheme: Harbeth-macOS-Demo
            destination: generic/platform=macOS
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build demo
        run: >-
          xcodebuild build
          -workspace Harbeth.xcworkspace
          -scheme '${{ matrix.scheme }}'
          -configuration Debug
          -destination '${{ matrix.destination }}'
          CODE_SIGNING_ALLOWED=NO

  documentation:
    name: DocC Build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build documentation
        run: >-
          xcodebuild docbuild
          -workspace Harbeth.xcworkspace
          -scheme Harbeth
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO

  cocoapods:
    name: CocoaPods Lint
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint podspec
        run: pod lib lint Harbeth.podspec --platforms=ios,macos,tvos --skip-tests
